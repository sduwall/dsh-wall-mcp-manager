# @sduwall/dsh-wall-mcp-manager Bundle 配置入口
# 安装本 bundle 后，以下插件条目会合并进 profile 的插件列表。
#
# 本插件自己不连任何 MCP：它把 servers 里的每一条配置翻译成一个
# `@deepseek-ai/dsh-mcp-client` 实例，在运行时通过 loader 动态挂载。
# 因此服务的增删改在界面上即时生效，不需要改 yml、不需要重启 DSH。
#
# 出厂默认 servers 为空：插件正常加载，只注册配置界面，不挂任何实例。
#
# servers 的键即 MCP 的 serverName（工具名命名空间），须匹配
# [A-Za-z0-9_-]{1,32}，且在所有活动的 mcp-client 实例之间唯一。
#
# 覆盖示例（写在 profile 的 cordis.patch.yml，不要改本文件——它属于 npm 包，会被升级覆盖）：
#   - id: dsh-wall-mcp-manager
#     config:
#       servers:
#         filesystem:
#           transport: stdio
#           command: npx
#           args: ['-y', '@modelcontextprotocol/server-filesystem', 'D:/workspace']
#         weather:
#           transport: streamable-http
#           url: https://mcp.example.com/mcp
#           headers:
#             X-Trace: 'on'                 # 普通请求头，界面上可读可改
#           secretHeaders:
#             Authorization: Bearer xxx     # 凭据请求头，界面上只显示「已配置」
- insert:
    - id: dsh-wall-mcp-manager
      name: '@sduwall/dsh-wall-mcp-manager'
      config:
        servers: {}
